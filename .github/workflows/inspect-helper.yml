name: Inspect helper image
on:
  push:
    branches: [inspect-helper]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/author && cd /tmp/author
          gh release download -R alpersamur3/asoft-ios-android -p '*.apk' -D .
          unzip -q -o ./*.apk 'assets/helper/*' -d x
          ls -l x/assets/helper
          mkdir rd && cd rd
          gunzip -c ../x/assets/helper/initrd.gz.bin > ../initrd.cpio
          file ../initrd.cpio
          cpio -idm < ../initrd.cpio 2>&1 | tail -2
          echo "=== ls asoft"; ls -l asoft
          for f in asoft/mkiosroot.sh asoft/asoft-disk.sh asoft/sweet-root-tweaks.py; do echo "=== $f"; cat $f; done
          echo "=== tools"; ls /tmp/author/rd/usr/bin | grep -iE "apfs|rsync|hfs|pigz|zstd|tar|cp$|dmg|7z|rclone|parallel" ; ls /tmp/author/rd/usr/local/bin /tmp/author/rd/asoft/ 2>&1; nproc
