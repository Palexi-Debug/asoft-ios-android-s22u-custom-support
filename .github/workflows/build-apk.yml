name: Build APK (native parts from the author's release)

# The repository holds no QEMU/Turnip libraries (pull-libs*.sh copies them from a phone). This workflow takes
# them, and the setup assets, from the author's released APK, builds this checkout's Java and C++ on top, and
# uploads the result. Default: the "dev" build (com.asoft.ios.dev), which installs BESIDE the released app and
# its iPhone, so nothing of the installed app is lost.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release of alpersamur3/asoft-ios-android to take the native libs from (empty: latest)"
        required: false
        default: ""
      variant:
        description: "dev = com.asoft.ios.dev beside the released app; release = com.asoft.ios (needs ASOFT_KEYSTORE_B64 secret)"
        required: true
        default: "dev"
        type: choice
        options: [dev, release]
  push:
    branches: [s22u-anr-fix]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK pieces this project pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Fetch the author's APK (native libs and setup assets)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          mkdir -p /tmp/author && cd /tmp/author
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R alpersamur3/asoft-ios-android -p '*.apk' -D .
          else
            gh release download -R alpersamur3/asoft-ios-android -p '*.apk' -D .
          fi
          ls -l *.apk
          unzip -q -o ./*.apk 'lib/arm64-v8a/*' 'assets/*' -d x
          ls x/lib/arm64-v8a | head -50

      - name: Put them where pull-libs.sh / pull-setup.sh would
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp -v /tmp/author/x/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          # the C++ in app/src/main/cpp builds these itself: a second copy fails the merge
          rm -fv app/src/main/jniLibs/arm64-v8a/{libgpucheck,librender,libunpack}.so
          # keep what the checkout already has in assets, add the rest
          cp -rn /tmp/author/x/assets/. app/src/main/assets/
          # the Windows JDK path in gradle.properties does not exist here
          sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Signing key (release only)
        if: ${{ github.event.inputs.variant == 'release' }}
        env:
          KS: ${{ secrets.ASOFT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ASOFT_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ASOFT_KEY_ALIAS }}
        run: |
          test -n "$KS" || { echo "Set the secrets ASOFT_KEYSTORE_B64, ASOFT_KEYSTORE_PASSWORD, ASOFT_KEY_ALIAS"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > "$RUNNER_TEMP/asoft-signing.properties" <<P
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KS_PASS
          P
          echo "ASOFT_SIGNING=$RUNNER_TEMP/asoft-signing.properties" >> "$GITHUB_ENV"

      - name: Fixed debug key (so a newer Dev build installs over the older one)
        if: ${{ github.event.inputs.variant != 'release' }}
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore

      - name: Build
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.variant }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug -PasoftDev
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: asoft-ios-android-apk
          path: app/build/outputs/apk/**/*.apk
